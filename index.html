<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মাদরাসা হাজিরা অ্যাপ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span onclick="logout()" style="position:absolute;left:16px;cursor:pointer;font-size:20px;" title="হোমে ফিরুন">🏠</span>
  মাদরাসা হাজিরা <span id="syncDot" class="sync-dot offline" title="সিংক অবস্থা"></span>
</header>
<div id="app" class="screen active" style="display:block;"></div>
<nav id="bottomNav" class="tabs" style="display:none;"></nav>

<!-- Firebase SDK (compat, no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
