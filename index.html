<header>

  ShikkhaOS <span id="syncDot" class="sync-dot offline" title="সিংক অবস্থা"></span>
</header>
<div id="app" class="screen active" style="display:block;">
  <div style="text-align:center;padding:60px 20px;color:#555;">
    <div style="font-size:15px;">লোড হচ্ছে...</div>
    <div id="bootStage" style="font-size:12px;color:#94a3b8;margin-top:10px;"></div>
  </div>
</div>
<nav id="bottomNav" class="tabs" style="display:none;"></nav>

<!-- "লোড হচ্ছে..." এর নিচে এখন কোন ধাপে অপেক্ষা চলছে ও কত সেকেন্ড হলো, তা দেখায় (অ্যাপ খুললেই মুছে যায়) -->
<script>
(function () {
  var t0 = Date.now();
  window.__bootStage = 'ফাইল নামছে';
  function paint() {
    var el = document.getElementById('bootStage');
    if (!el) return false;
    el.textContent = window.__bootStage + ' · ' + (Math.round((Date.now() - t0) / 100) / 10) + ' সেকেন্ড';
    return true;
  }
  window.bootStage = function (s) { window.__bootStage = s; paint(); };
  var iv = setInterval(function () { if (!paint()) clearInterval(iv); }, 250);
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded || performance.now() > 30000) return;
    reloaded = true; location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
